Section "ServerFlags"
    Option "BlankTime"    "0"
    Option "StandbyTime"  "0"
    Option "SuspendTime"  "0"
    Option "OffTime"      "0"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "FlashOS framebuffer"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "FlashOS screen"
    Device     "FlashOS framebuffer"
    DefaultDepth 24
EndSection
