name: Build FlashOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib qemu-system-x86 python3-pil dosfstools mtools

      - name: Build FlashOS.iso
        run: make

      - name: Boot test in QEMU (CD and USB)
        run: |
          python3 tools/qemu_test.py build/FlashOS.iso screenshots cd
          python3 tools/qemu_test.py build/FlashOS.iso screenshots usb
          # USB stick with games (real FAT32 tools) + blank hard disk -> INSTALL
          mkfs.fat -C -F 32 -n GAMES stick.img 65536
          mcopy -i stick.img swf/catch.swf "::/Usb Catch.swf"
          mmd -i stick.img ::/games
          mcopy -i stick.img swf/bounce.swf ::/games/usbbounce.swf
          truncate -s 64M hdd.img
          python3 tools/qemu_test.py build/FlashOS.iso screenshots install hdd.img stick.img
          # networking: serve a SWF from the runner, guest reaches it at 10.0.2.2
          mkdir -p www && cp swf/flashlogo.swf www/netlogo.swf
          (cd www && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          python3 tools/qemu_test.py build/FlashOS.iso screenshots net
          python3 tools/qemu_test.py build/FlashOS.iso screenshots net8139
          # boot the installed hard disk without the CD
          python3 tools/qemu_test.py build/FlashOS.iso screenshots hdd hdd.img
          ls -l screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/FlashOS.iso screenshots/cd_02_ready.png screenshots/cd_05_flashlogo.png screenshots/usb_02_ready.png screenshots/cd_09_history.png screenshots/cd_10_catch.png screenshots/cd_12_after_click.png screenshots/install_02_ls.png screenshots/install_02b_mem.png screenshots/install_03_usb_game.png screenshots/install_05_installed.png screenshots/hdd_01_ready.png screenshots/hdd_02_ls.png screenshots/net_01_net.png screenshots/net_02_get.png screenshots/net_03_web.png screenshots/net_04_play.png screenshots/net8139_02_get.png \
            --title "FlashOS (latest build)" \
            --notes "Bootable FlashOS ISO built from ${GITHUB_SHA::7}. Boot it in QEMU/VirtualBox (as a CD) or write it to a USB stick. Legacy BIOS boot." \
            --latest
