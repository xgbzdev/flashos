name: Build FlashOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib qemu-system-x86 python3-pil python3-numpy python3-fonttools dosfstools mtools genisoimage

      - name: Build FlashOS.iso
        run: make

      - name: Build Flash Notepad and its CD
        run: |
          make apps
          mkdir -p notepadcd && cp build/apps/FlashNotepad.swf apps/notepad/cd/* notepadcd/
          genisoimage -quiet -V "Flash notepad" -J -r -o Flash-notepad.iso notepadcd
          cp build/apps/FlashNotepad.swf .
          mkdir -p mazecd && cp build/apps/Maze.swf mazecd/
          genisoimage -quiet -V "Maze" -J -r -o Maze.iso mazecd
          cp build/apps/Maze.swf . && cp build/apps/BallGame.swf .
          make build/ByroTT.iso
          cp build/ByroTT.iso .

      - name: Boot test in QEMU (CD and USB)
        run: |
          python3 tools/qemu_test.py build/FlashOS.iso screenshots cd
          python3 tools/qemu_test.py build/FlashOS.iso screenshots usb
          # USB stick with games (real FAT32 tools) + blank hard disk -> INSTALL
          mkfs.fat -C -F 32 -n GAMES stick.img 65536
          mcopy -i stick.img swf/catch.swf "::/Usb Catch.swf"
          mmd -i stick.img ::/games
          mcopy -i stick.img swf/bounce.swf ::/games/usbbounce.swf
          truncate -s 64M hdd.img
          python3 tools/qemu_test.py build/FlashOS.iso screenshots install hdd.img stick.img
          # game CD: a data-only ISO with SWF files (Joliet long names + folder)
          mkdir -p gamecd/more && cp swf/catch.swf "gamecd/CD Game.swf" && cp swf/bounce.swf gamecd/more/cdbounce.swf
          genisoimage -quiet -J -r -o gamecd.iso gamecd
          python3 tools/qemu_test.py build/FlashOS.iso screenshots gamecd gamecd.iso
          # sound: AC'97 recorded to WAV, plus JPEG / mask / text-field test
          genisoimage -quiet -J -r -o testcd.iso tests
          python3 tools/qemu_test.py build/FlashOS.iso screenshots audio testcd.iso audio.wav
          python3 tools/analyse_audio.py audio.wav | tee audio-report.txt
          # networking: serve a SWF from the runner, guest reaches it at 10.0.2.2
          mkdir -p www && cp swf/flashlogo.swf www/netlogo.swf
          (cd www && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          python3 tools/qemu_test.py build/FlashOS.iso screenshots net
          python3 tools/qemu_test.py build/FlashOS.iso screenshots net8139
          # boot the installed hard disk without the CD
          python3 tools/qemu_test.py build/FlashOS.iso screenshots hdd hdd.img
          # Flash Notepad from its CD: save to the hard disk, restart, open it again
          python3 tools/qemu_test.py build/FlashOS.iso screenshots notepad hdd.img Flash-notepad.iso
          python3 tools/qemu_test.py build/FlashOS.iso screenshots notepad2 hdd.img Flash-notepad.iso
          # Maze 3D from its CD
          python3 tools/qemu_test.py build/FlashOS.iso screenshots maze Maze.iso
          # ByroTT: install from its CD, start it from the disk, uninstall, FlashOS again
          truncate -s 3G byr.img
          python3 tools/qemu_test.py ByroTT.iso screenshots byr_setup byr.img
          python3 tools/qemu_test.py ByroTT.iso screenshots byr_boot byr.img
          python3 tools/qemu_test.py ByroTT.iso screenshots byr_cd byr.img
          ls -l screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Bootable FlashOS ISO built from ${GITHUB_SHA::7}. Boot it in QEMU/VirtualBox (as a CD) or write it to a USB stick. Legacy BIOS boot."
            echo
            echo "Sound test (QEMU AC97 recording):"
            echo '```'
            cat audio-report.txt || true
            echo '```'
          } > notes.md
          ASSETS="build/FlashOS.iso Flash-notepad.iso FlashNotepad.swf Maze.iso Maze.swf BallGame.swf screenshots/maze_*.png ByroTT.iso screenshots/byr_*.png screenshots/notepad_*.png screenshots/notepad2_*.png screenshots/cd_02_ready.png screenshots/cd_05_flashlogo.png screenshots/usb_02_ready.png screenshots/cd_09_history.png screenshots/cd_10_catch.png screenshots/cd_12_after_click.png screenshots/install_02_ls.png screenshots/install_02b_mem.png screenshots/install_03_usb_game.png screenshots/install_05_installed.png screenshots/hdd_01_ready.png screenshots/hdd_02_ls.png screenshots/hdd_03_no_install.png screenshots/net_01_net.png screenshots/net_02_get.png screenshots/net_03_web.png screenshots/net_04_play.png screenshots/net8139_02_get.png screenshots/gamecd_01_ls.png screenshots/audio_01_vol.png screenshots/audio_01b_snddiag.png screenshots/audio_01c_snddiag2.png screenshots/audio_02_features.png screenshots/gamecd_02_play.png"
          # every build is its own release, marked Latest; download links:
          #   https://github.com/<owner>/<repo>/releases/latest/download/<file>
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" $ASSETS --title "FlashOS + ByroTT 1.0 (build ${GITHUB_RUN_NUMBER})" --notes-file notes.md --latest
          # tidy up: the old "latest" release and builds older than the last 3 (GitHub may refuse; that is fine)
          gh release delete latest --yes --cleanup-tag || true
          for t in $(gh release list --limit 50 --json tagName -q '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +4); do
            gh release delete "$t" --yes --cleanup-tag || true
          done
